<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro</title>
    </head>

    <body class="auth-body registro-body">

        <main class="auth-container">

            <section class="auth-card registro-card">

                <div class="registro-header">
                    <span class="registro-icono">🍔</span>

                    <h1>Crear cuenta</h1>

                    <p>
                        Registrate para comenzar a disfrutar de Food Store
                    </p>
                </div>

                <form id="form-registro" class="auth-form">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ingrese su email"
                        required
                    >

                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese su contraseña"
                        required
                    >

                    <button type="submit">
                        Crear cuenta
                    </button>

                </form>

                <p class="auth-link">
                    ¿Ya tenés una cuenta?
                    <a href="../login/login.html">
                        Iniciar sesión
                    </a>
                </p>

            </section>

        </main>

        <script type="module" src="./registro.ts"></script>

    </body>

</html>
