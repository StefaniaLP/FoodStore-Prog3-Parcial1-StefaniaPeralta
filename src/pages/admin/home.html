<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Administración - Food Store</title>

</head>

<body>

    <header>

        <h1>Panel de Administración</h1>

        <button id="btn-logout">
            Cerrar sesión
        </button>
    </header>


    <main>

        <section>

            <h2>Gestión de Productos</h2>

            <table border="1">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>

                </thead>


                <tbody id="tabla-productos">
                </tbody>

            </table>

        </section>


        <section>

            <h2>Agregar Producto Rapido</h2>

            <form>

                <p>
                    <label for="nombre">Nombre:</label>
                    <br>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required>
                </p>


                <p>
                    <label for="precio">Precio:</label>
                    <br>

                    <input
                        type="number"
                        id="precio"
                        name="precio"
                        min="0"
                        required>
                </p>


                <p>
                    <label for="categoria">Categoría:</label>
                    <br>

                    <select
                        id="categoria"
                        name="categoria"
                        required>

                        <option value="">
                            Seleccione una categoría
                        </option>

                    </select>

                </p>


                <button type="submit">
                    Guardar Producto
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>Food Store - Panel de Administración</p>
    </footer>

    
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./admin.ts"></script>

</body>

</html>
